<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#317EFB" />

        <title>Seafront</title>

        <link rel="stylesheet" href="/css/reset.css" />
        <!-- importing plotly as module fails, so we do this instead -->
        <script src="/vendor/plotly.min.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "alpine": "/vendor/alpine/alpinejs-3-14-9.js",

                    "json5": "/vendor/json5/json5-2-2-3.js",

                    "three": "/vendor/three/three-0-176-0.js",
                    "three/addons/capabilities/WebGL": "/vendor/three-addons/WebGL.min.js",
                    "three/addons/loaders/FontLoader": "/vendor/three-addons/FontLoader.min.js",
                    "three/addons/utils/BufferGeometryUtils": "/vendor/three-addons/BufferGeometryUtils.min.js",

                    "platenavigator": "/src/platenavigator.js",
                    "numberinput": "/src/numberinput.js",
                    "filterselect": "/src/filterselect.js",
                    "microscope_setup": "/src/microscope_setup.js",
                    "channelview": "/src/channelview.js",
                    "tooltip": "/src/tooltip.js",
                    "tabs": "/src/tabs.js",
                    "histogram": "/src/histogram.js",
                    "namespace-parser": "/src/namespace-parser.js"
                }
            }
        </script>

        <script src="/src/init.js" type="module"></script>

        <style>
            .fullwidth {
                width: 100%;
            }

            .clickable {
                cursor: pointer;
            }

            .microscope-busy {
                cursor: wait !important;
            }

            .busy-indicator {
                animation: busyPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            .busy-indicator.hide {
                animation: busyPopOut 0.2s ease-in forwards;
            }

            @keyframes busyPopIn {
                from {
                    opacity: 0;
                    transform: translateX(-50%) scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) scale(1);
                }
            }

            @keyframes busyPopOut {
                from {
                    opacity: 1;
                    transform: translateX(-50%) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translateX(-50%) scale(0.8);
                }
            }

            .noselect {
                user-select: none;
            }

            .scrolly {
                overflow-y: auto;
            }
            label[disabled] {
                color: var(--muted-text-color);
            }

            /* Machine Config Namespace Styles */
            .machine-config-controls {
                display: grid;
                grid-template-columns: auto 1fr auto;
                gap: 1em;
                margin-bottom: 1em;
                padding: 0.5em;
                background-color: var(--bg-color);
                border-radius: 4px;
                align-items: center;
            }

            .button-row {
                display: flex;
                gap: 0.5em;
                flex-wrap: wrap;
            }

            .namespace-tree {
                border: 1px solid var(--border-color);
                border-radius: 4px;
            }

            .namespace-section {
                border-bottom: 1px solid var(--border-color);
            }

            .namespace-section:last-child {
                border-bottom: none;
            }

            .namespace-header {
                display: flex;
                align-items: center;
                gap: 0.5em;
                padding: 0.75em 1em;
                background-color: var(--accent-bg-color);
                border-bottom: 1px solid var(--border-color);
                font-weight: bold;
                user-select: none;
            }

            .namespace-header:hover {
                background-color: var(--strong-bg-color);
            }

            .namespace-child .namespace-header {
                background-color: var(--bg-color);
                padding-left: 2em;
                font-weight: normal;
            }

            .namespace-child .namespace-header:hover {
                background-color: var(--accent-bg-color);
            }

            .item-count {
                font-size: 0.85em;
                color: var(--muted-text-color);
                font-weight: normal;
            }

            .namespace-content {
                padding: 0.5em;
            }

            .namespace-child .namespace-content {
                padding-left: 2em;
            }

            .config-item {
                margin: 0.5em 0;
                padding: 0.75em;
                border: 1px solid var(--border-color);
                border-radius: 4px;
                background-color: var(--bg-color);
            }

            .config-row {
                display: grid;
                grid-template-columns: auto 2fr 3fr auto;
                gap: 1em;
                align-items: start;
            }

            .config-privileged {
                display: flex;
                align-items: center;
            }

            .config-info {
                display: flex;
                flex-direction: column;
                gap: 0.25em;
            }

            .config-handle {
                font-weight: bold;
                font-family: monospace;
                color: var(--accent-color);
            }

            .config-name {
                font-size: 0.9em;
                color: var(--muted-text-color);
            }

            .config-value {
                display: flex;
                align-items: center;
            }

            .config-value input,
            .config-value textarea,
            .config-value select,
            .config-value button {
                width: 100%;
                max-width: 300px;
            }

            .config-kind {
                font-size: 0.8em;
                color: var(--muted-text-color);
                font-style: italic;
                text-align: center;
            }

            .machine-config-flat-table {
                width: 100%;
                table-layout: fixed;
            }

            .machine-config-flat-table th:nth-child(1),
            .machine-config-flat-table td:nth-child(1) {
                width: 3.5rem;
            }

            .machine-config-flat-table th:nth-child(2),
            .machine-config-flat-table td:nth-child(2) {
                width: 26%;
            }

            .machine-config-flat-table th:nth-child(3),
            .machine-config-flat-table td:nth-child(3) {
                width: 36%;
            }

            .machine-config-flat-table th:nth-child(4),
            .machine-config-flat-table td:nth-child(4) {
                width: 7rem;
            }

            .machine-config-flat-table td:nth-child(2),
            .machine-config-flat-table td:nth-child(5) {
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            .machine-config-flat-table td:nth-child(3) input,
            .machine-config-flat-table td:nth-child(3) textarea,
            .machine-config-flat-table td:nth-child(3) select,
            .machine-config-flat-table td:nth-child(3) button {
                width: 100%;
                max-width: none;
                box-sizing: border-box;
            }
        </style>

        <link href="/css/tooltip.css" rel="stylesheet" />
        <link href="/css/tabs.css" rel="stylesheet" />
    </head>

    <body
        x-data="microscope_state"
        x-bind:class="{ 'microscope-busy': state && state.is_busy }"
        x-init="await manualInit();
                // Set up watcher after init is complete
                if(_microscope_config) {
                    $watch('_microscope_config', () => {
                        saveCurrentConfig();
                    }, { deep: true });
                }"
    >
        <link rel="stylesheet" href="/css/theme.css" />

        <style>
            .section {
                min-width: 0;
                margin: 0.3em;
                border: 1px solid var(--border-color);
            }
            .section > :first-child {
                padding: 0.2em 0.4em;
                background: var(--weak-bg-color);
                border-bottom: 1px solid var(--border-color);
                border-left: 3px solid var(--accent-color);
                font-weight: bold;
                text-align: left;
            }
            .section > :not(:first-child) {
                min-width: 0;
                padding: 0.3em;
            }
        </style>

        <link href="/css/loadingscreen.css" rel="stylesheet" />
        <div
            id="loadingscreen"
            x-effect="if(initDone)$el.style.display='none';"
        >
            <div id="loadingscreentext">Loading Seafront ...</div>
        </div>

        <!-- Central Error Modal -->
        <div
            x-show="centralError.show"
            x-transition.opacity.duration.300ms
            id="error-modal-overlay"
            @click="if($event.target === $el) centralError.show = false"
        >
            <div id="error-modal" @click.stop>
                <div id="error-modal-header" :style="centralError.title?.includes('Warning') ? 'background: #ff9800' : ''">
                    <span x-text="centralError.title?.includes('Warning') ? '⚠ Warning' : '⚠ Error'"></span>
                    <button @click="centralError.show = false" id="error-modal-close">&times;</button>
                </div>
                <div id="error-modal-body">
                    <div id="error-modal-title" x-text="centralError.title"></div>
                    <div id="error-modal-message" x-text="centralError.message"></div>
                    <div id="error-modal-timestamp" x-text="formattedErrorTimestamp"></div>
                </div>
                <div id="error-modal-footer">
                    <template x-if="centralError.showReloadButton">
                        <button @click="reloadPage()" id="error-modal-reload">Reload</button>
                    </template>
                    <button @click="centralError.show = false" id="error-modal-ok">OK</button>
                </div>
            </div>
        </div>

        <!-- Acquisition Confirmation Modal -->
        <div
            x-show="acquisitionConfirm.show"
            x-transition.opacity.duration.300ms
            id="confirm-modal-overlay"
            @click="if($event.target === $el) acquisitionConfirm.show = false"
        >
            <div id="confirm-modal" @click.stop>
                <div id="confirm-modal-header">
                    <span>Start Acquisition?</span>
                    <button @click="acquisitionConfirm.show = false" id="confirm-modal-close">&times;</button>
                </div>
                <div id="confirm-modal-body">
                    <div class="confirm-row">
                        <span class="confirm-label">Project:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.project_name ?? '--'"></span>
                    </div>
                    <div class="confirm-row">
                        <span class="confirm-label">Plate:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.plate_name ?? '--'"></span>
                    </div>
                    <div class="confirm-row" x-show="_microscope_config?.comment">
                        <span class="confirm-label">Comment:</span>
                        <span class="confirm-value confirm-comment" x-text="_microscope_config?.comment ?? ''"
                            x-init="enabletooltip($el)" x-bind:tooltip="_microscope_config?.comment ?? ''"></span>
                    </div>
                    <div class="confirm-row">
                        <span class="confirm-label">Wells:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.num_selected_wells ?? '--'"></span>
                    </div>
                    <div class="confirm-row">
                        <span class="confirm-label">Sites per well:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.num_selected_sites ?? '--'"></span>
                    </div>
                    <div class="confirm-row">
                        <span class="confirm-label">Channels:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.num_channels ?? '--'"></span>
                    </div>
                    <div class="confirm-row" x-show="acquisitionConfirm.estimate?.num_z_planes_total > acquisitionConfirm.estimate?.num_channels">
                        <span class="confirm-label">Total Z-planes:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.num_z_planes_total ?? '--'"></span>
                    </div>
                    <div class="confirm-row" x-show="acquisitionConfirm.estimate?.num_timepoints > 1">
                        <span class="confirm-label">Timepoints:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.num_timepoints ?? '--'"></span>
                    </div>
                    <div class="confirm-row">
                        <span class="confirm-label">Laser autofocus:</span>
                        <span class="confirm-value" x-text="_microscope_config?.autofocus_enabled ? 'Enabled' : 'Disabled'"></span>
                    </div>
                    <div class="confirm-row confirm-highlight">
                        <span class="confirm-label">Total images:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate?.total_num_images?.toLocaleString() ?? '--'"></span>
                    </div>
                    <div class="confirm-row confirm-highlight">
                        <span class="confirm-label">Storage (max):</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimate ? `${acquisitionConfirm.estimate.max_storage_size_GB.toFixed(2)} GB` : '--'"></span>
                    </div>
                    <div class="confirm-row confirm-highlight">
                        <span class="confirm-label" x-init="enabletooltip($el)" tooltip="this is super rough estimate, usually (!) 50-200% of the actual time.">Est. time:</span>
                        <span class="confirm-value" x-text="acquisitionConfirm.estimatedTimeString"></span>
                    </div>
                </div>
                <div id="confirm-modal-footer">
                    <button @click="acquisitionConfirm.show = false" id="confirm-modal-back"
                        x-init="enabletooltip($el)" tooltip="Go back to configuration">Back</button>
                    <button @click="await acquisitionConfirmStart()" id="confirm-modal-start"
                        x-init="enabletooltip($el)" tooltip="Begin the acquisition with current settings">Start Acquisition</button>
                </div>
            </div>
        </div>

        <!-- Cancel Acquisition Confirmation Modal -->
        <div
            x-show="cancelConfirm.show"
            x-transition.opacity.duration.300ms
            id="cancel-modal-overlay"
            @click="if($event.target === $el) cancelConfirm.show = false"
        >
            <div id="cancel-modal" @click.stop>
                <div id="cancel-modal-header">
                    <span>Stop Acquisition?</span>
                    <button @click="cancelConfirm.show = false" id="cancel-modal-close">&times;</button>
                </div>
                <div id="cancel-modal-body">
                    <template x-if="!cancelConfirm.foreign">
                        <p>This stops the running acquisition. Images taken so far are kept.</p>
                    </template>
                    <template x-if="cancelConfirm.foreign">
                        <div>
                            <p><strong x-text="`The microscope is locked by ${cancelConfirm.owner ?? 'another client'}.`"></strong></p>
                            <p>Stopping now interrupts their run. Stopping is always possible, because it may be needed to protect the hardware, but please make sure they know.</p>
                            <p>If you also want to control the microscope afterwards, take over the lock. That frees their lock without notifying them.</p>
                        </div>
                    </template>
                </div>
                <div id="cancel-modal-footer">
                    <button @click="cancelConfirm.show = false" id="cancel-modal-back" :disabled="cancelConfirm.busy">Keep running</button>
                    <button x-show="cancelConfirm.foreign" @click="await confirmAcquisitionCancel({ takeOverLock: true })"
                        id="cancel-modal-takeover" :disabled="cancelConfirm.busy">Stop and take over lock</button>
                    <button @click="await confirmAcquisitionCancel()" id="cancel-modal-stop" :disabled="cancelConfirm.busy"
                        x-text="cancelConfirm.foreign ? 'Stop their acquisition' : 'Stop acquisition'"></button>
                </div>
            </div>
        </div>

        <template x-if="initDone">
            <div id="content">
                <!-- Mock Mode Indicator Banner -->
                <div x-show="mockModeActive"
                     style="grid-area: banner;
                            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
                            color: white; padding: 8px 16px; text-align: center;
                            font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 14px;
                            border-bottom: 2px solid #e65100;">
                    ⚠️ Running in offline mock mode - server not available
                </div>

                <!-- Microscope Busy Indicator -->
                <div x-show="showBusyIndicator"
                     x-bind:class="busyIndicatorClass"
                     x-bind:style="{
                         position: 'fixed',
                         top: mockModeActive ? '42px' : '20px',
                         left: '50%',
                         transform: 'translateX(-50%)',
                         zIndex: 9999,
                         background: '#ff6b6b',
                         color: 'white',
                         padding: '12px 24px',
                         borderRadius: '8px',
                         fontWeight: 'bold',
                         boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
                         fontSize: '16px',
                         border: '2px solid #ff5252'
                     }">
                    🔒 Microscope is busy, please wait...
                </div>

<link rel="stylesheet" href="/css/workspace.css" />
<div id="channel-renderer"><canvas id="c" x-init="initChannelView($el);$watch('theme',()=>view?.updateTheme())"></canvas></div>
<main id="workspaces" x-init="initTabs($el)">
 <div tabname="Experiment" id="experiment-page">
 <div class="experiment-layout">
  <div class="experiment-configuration">
<div class="experiment-metadata"><div class="section">
                                <div>Experiment details</div>
                                <div>
                                    <div id="names" class="scrolly">
                                        <style>
                                            #names {
                                                display: grid;
                                                grid-template:
                                                    " l-proj  v-proj" auto
                                                    " l-plate v-plate" auto
                                                    " l-cell  v-cell" auto
                                                    / auto 1fr;
                                                gap: 0.3em 1em;
                                            }
                                        </style>
                                        <label> Project Name</label
                                        ><input
                                            type="text"
                                            placeholder="Name of the project"
                                            x-model="microscope_config.project_name"
                                        />
                                        <label> Plate Name</label
                                        ><input
                                            type="text"
                                            placeholder="Name/Identifier of the plate"
                                            x-model="microscope_config.plate_name"
                                        />
                                        <label> Cell Line[s]</label
                                        ><input
                                            type="text"
                                            placeholder="Cell lines[s] used on the plate"
                                            x-model="microscope_config.cell_line"
                                        />
                                        <label> Comment</label
                                        ><textarea
                                            placeholder="description of the plate to understand its purpose."
                                            x-model="microscope_config.comment"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

  </div>
<div class="section">
                                <div>Sites &amp; timing</div>
                                <div>
                                    <div id="grid-config" class="scrolly">
                                        <style>
                                            #grid-config {
                                                display: grid;
                                                grid-template:
                                                    " l-n-x       v-n-x l-d-x       v-d-x   v-d-x   v-d-x   v-d-x   v-d-x   v-d-x" auto
                                                    " l-n-y       v-n-y l-d-y       v-d-y   v-d-y   v-d-y   v-d-y   v-d-y   v-d-y" auto
                                                    " l-n-t       v-n-t l-d-t       l-d-t-h v-d-t-h l-d-t-m v-d-t-m l-d-t-s v-d-t-s" auto
                                                    / auto 3.5em auto auto minmax(2.5em, 1fr) auto minmax(2.5em, 1fr) auto minmax(2.5em, 1fr);
                                                gap: 0.3em 0.4em;

                                                input {
                                                    min-width: 0;
                                                    width: 100%;
                                                    box-sizing: border-box;
                                                }
                                                label {
                                                    height: min-content;
                                                    width: max-content;
                                                }
                                            }
                                        </style>
                                        <label style="grid-area: l-n-x"
                                            >Sites X</label
                                        >
                                        <input
                                            style="grid-area: v-n-x"
                                            type="number"
                                            min="1"
                                            max="999"
                                            step="1"
                                            @change="updatePlate"
                                            x-model.number="microscope_config.grid.num_x"
                                        />

                                        <label style="grid-area: l-d-x"
                                            >Δx [mm]</label
                                        >
                                        <input
                                            style="grid-area: v-d-x"
                                            x-effect="disableElement($el,()=>microscope_config.grid.num_x==1)"
                                            type="number"
                                            min="0.1"
                                            max="999"
                                            step="0.1"
                                            @change="updatePlate"
                                            x-model.number="microscope_config.grid.delta_x_mm"
                                        />

                                        <label style="grid-area: l-n-y"
                                            >Sites Y</label
                                        >
                                        <input
                                            style="grid-area: v-n-y"
                                            type="number"
                                            min="1"
                                            max="999"
                                            step="1"
                                            @change="updatePlate"
                                            x-model.number="microscope_config.grid.num_y"
                                        />

                                        <label style="grid-area: l-d-y"
                                            >Δy [mm]</label
                                        >
                                        <input
                                            style="grid-area: v-d-y"
                                            x-effect="disableElement($el,()=>microscope_config.grid.num_y==1)"
                                            type="number"
                                            min="0.1"
                                            max="999"
                                            step="0.1"
                                            @change="updatePlate"
                                            x-model.number="microscope_config.grid.delta_y_mm"
                                        />

                                        <label style="grid-area: l-n-t"
                                            >Timepoints</label
                                        >
                                        <input
                                            style="grid-area: v-n-t"
                                            type="number"
                                            min="1"
                                            max="9999"
                                            step="1"
                                            @change="updatePlate"
                                            x-model.number="microscope_config.grid.num_t"
                                        />

                                        <label style="grid-area: l-d-t"
                                            >Interval</label
                                        >
                                        <label style="grid-area: l-d-t-h"
                                            >h</label
                                        >
                                        <input
                                            x-effect="disableElement($el,()=>microscope_config.grid.num_t==1)"
                                            style="grid-area: v-d-t-h"
                                            type.number="number"
                                            min="0"
                                            max="999"
                                            step="0.1"
                                            @change="updatePlate"
                                            x-model="microscope_config.grid.delta_t.h"
                                        />
                                        <label style="grid-area: l-d-t-m"
                                            >m</label
                                        >
                                        <input
                                            x-effect="disableElement($el,()=>microscope_config.grid.num_t==1)"
                                            style="grid-area: v-d-t-m"
                                            type.number="number"
                                            min="0"
                                            max="59.9"
                                            step="0.1"
                                            @change="updatePlate"
                                            x-model="microscope_config.grid.delta_t.m"
                                        />
                                        <label style="grid-area: l-d-t-s"
                                            >s</label
                                        >
                                        <input
                                            x-effect="disableElement($el,()=>microscope_config.grid.num_t==1)"
                                            style="grid-area: v-d-t-s"
                                            type.number="number"
                                            min="0"
                                            max="59.9"
                                            step="0.1"
                                            @change="updatePlate"
                                            x-model="microscope_config.grid.delta_t.s"
                                        />
                                    </div>
                                </div>
                            </div>
<section class="section experiment-plan">
   <div>Acquisition plan</div>
   <div>
    <div class="plan-totals">
     <div><strong x-text="microscope_config.grid.mask.filter(s => s.selected).length"></strong><span>sites / well</span></div>
     <div><strong x-text="microscope_config.grid.num_t"></strong><span>timepoints</span></div>
     <div><strong x-text="num_images.toLocaleString()"></strong><span>total images</span></div>
    </div>
    <div class="plan-channel-heading"><span>Enabled channels</span><span>Z planes</span></div>
    <template x-for="channel in microscope_config.channels.filter(c => c.enabled)" :key="channel.handle">
     <div class="plan-channel"><span x-text="channel.name"></span><span x-text="channel.num_z_planes"></span></div>
    </template>
    <p class="plan-empty" x-show="!microscope_config.channels.some(c => c.enabled)">No channels enabled. Configure imaging in Explore.</p>
   </div>
  </section>
  </div>
  <div class="experiment-wells"><div class="section">
                                <div class="experiment-panel-heading"><span>Acquisition wells</span><span class="well-count" x-text="`${microscope_config.plate_wells.filter(w => w.selected &amp;&amp; w.row >= 0 &amp;&amp; w.col >= 0).length} selected`"></span></div>
                                <div>
                                    <div id="well-selector" class="scrolly">
                                        <style>
                                            #well-selector {
                                                display: grid;
                                                grid-template: "p" auto "w" auto / auto;
                                                gap: 0.3em;
                                            }
                                        </style>
                                        <script>
                                            function checkDefaultPlateType(
                                                el,
                                                plate,
                                                microscope_config,
                                            ) {
                                                if (
                                                    plate.Model_id ==
                                                    microscope_config
                                                        .wellplate_type.Model_id
                                                ) {
                                                    el.setAttribute(
                                                        "selected",
                                                        "",
                                                    );
                                                }
                                            }
                                        </script>

                                        <div id="plate-type-selector">
                                            <style>
                                                #plate-type-selector {

                                                    <span x-text="wellText(well)"></span>
                                                </div>

                                                    :data-well-col="well.col"

                                        <div class="well-selection-help"><span>Click a well or drag a range to toggle selection</span><span class="forbidden-legend"><i></i>Forbidden center</span><span x-text="selectionRangeText"></span></div>
                                        </div>
                                        <aside class="site-pattern-editor" aria-label="Sites within a well">

                                            <div class="site-pattern-actions"><span>Select sites</span><button type="button" @click="selectAllPreviewSites(true)">All</button><button type="button" @click="selectAllPreviewSites(false)">None</button></div>
                                            <dl class="site-pattern-dimensions">
                                                <dt>Well [mm]</dt><dd x-text="`${microscope_config.wellplate_type.Well_size_x_mm} × ${microscope_config.wellplate_type.Well_size_y_mm}`"></dd>
                                                <dt>FOV [mm]</dt><dd x-text="`${(plateNavigator?.objective.fovx ?? 0.9).toFixed(2)} × ${(plateNavigator?.objective.fovy ?? 0.9).toFixed(2)}`"></dd>
                                            </dl>
                                            <p class="site-pattern-scope">Click a field or its center to toggle it.</p>
                                        </aside>
                                    </div>
                                </div>
                            </div></div>
<section class="section experiment-protocols">
   <div class="experiment-panel-heading"><span>Saved protocols</span><span class="panel-heading-note">Experiment details, wells, channels, sites &amp; timing</span></div>

  </section>
 </div>

<div tabname="Explore" id="explore-page">
 <aside class="explore-navigation" aria-label="Plate navigation and shared controls">
<div class="explore-navigation-body">

  <div class="plate-locator">
   <div
                                id="plate"

                                x-init="initPlateNavigator($el, this)"
                            ></div>
   <div class="plate-zoom-controls" aria-label="Plate zoom">
    <button @click="plateNavigator?.cameraApplyDeltaZoom(-0.2)" title="Zoom into plate">+</button>
    <button @click="plateNavigator?.cameraApplyDeltaZoom(0.25)" title="Zoom out of plate">−</button>
    <button @click="plateNavigator?.cameraFit({ax:0, ay:0, bx:microscope_config.wellplate_type.Length_mm, by:microscope_config.wellplate_type.Width_mm})">Fit plate</button>
   </div>
  </div>
  <div class="explore-stage">
   <div class="explore-heading">Navigate & focus</div>
   <div class="stage-readout">
    <span>X <b x-html="formatStageCoordXY(state.adapter_state?.stage_position.x_pos_mm)"></b> mm</span>
    <span>Y <b x-html="formatStageCoordXY(state.adapter_state?.stage_position.y_pos_mm)"></b> mm</span>
    <span>Z <b x-html="formatStageCoordZ(state.adapter_state?.stage_position.z_pos_mm)"></b> µm</span>
   </div>
   <form class="well-jump" @submit.prevent="await exploreMoveToWell($refs.exploreWell)">
    <label for="explore-well">Well</label>
    <input id="explore-well" x-ref="exploreWell" type="text" required
     placeholder="H12" autocomplete="off" autocapitalize="characters" spellcheck="false"
     title="Enter a well name and press Enter to move" @input="$el.setCustomValidity('')" />
    <button type="submit" :disabled="state.is_busy">Go to well</button>
   </form>
   <div class="stage-step-controls">
    <label for="explore-axis">Axis</label>
    <select id="explore-axis" x-model="moveByAxis"><option value="x">X [mm]</option><option value="y">Y [mm]</option><option value="z">Z [µm]</option></select>
    <label for="explore-step">Step</label>
    <input id="explore-step" type="number" min="0" step="0.001" x-model.number="moveByDistance" />
    <button @click="stageMoveBy('-')" :disabled="state.is_busy" aria-label="Move stage in negative direction">−</button>
    <button @click="stageMoveBy('+')" :disabled="state.is_busy" aria-label="Move stage in positive direction">+</button>
   </div>
   <div class="explore-help">Double-click the plate to move, or type a well name and press Enter.</div>
  </div>
  <div class="explore-capture">
   <div class="section">
                                <div>Quick Capture</div>
                                <div style="display: flex; align-items: center; gap: 0.5em;">
                                    <button
                                        @click="Actions.snapAllChannels()"
                                        x-init="enabletooltip($el)"
                                        x-bind:tooltip="`
                                            Snap all enabled channels with their configured settings.

                                            This will:
                                            • Run laser autofocus if AF is checked
                                            • Move to each channel's Z-offset
                                            • Capture images with the configured exposure and gain
                                            • Return to focused Z position
                                            • Display captured images
                                        `"
                                    >
                                        Snap All Channels
                                    </button>
                                    <label style="display: inline-flex; align-items: center;"
                                           x-init="enabletooltip($el)"
                                           x-bind:tooltip="`
                                            Reflects 'Use autofocus during acquisition' setting from Laser Autofocus controls.

                                            When checked, Snap All will:
                                            • Run laser autofocus before imaging
                                            • Apply per-channel Z-offsets relative to focused position
                                           `">
                                        <input type="checkbox"
                                               disabled
                                               x-bind:checked="microscope_config.autofocus_enabled">
                                        AF
                                    </label>
                                </div>
                            </div>
   <div class="focus-summary">
    <strong>Focus reference</strong>
    <span x-text="focusReferenceChannel?.name ?? 'Choose a reference in a channel column'"></span>
    <span x-text="focusReferenceReady ? 'Reference ready' : 'Setup is below the selected channel'"></span>
    <button x-show="focusReferenceChannel" @click="document.getElementById(`focus-setup-${focusReferenceChannelHandle}`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' })">Show focus setup</button>
   </div>
  </div>

<details class="explore-details"><summary>Plate selection & mouse controls</summary>


                            <!-- Row 1: Legend -->

                                <span
                                    x-bind:style="`background:#${matSiteColor.toString(16).padStart(6,'0')}A0; padding: 0.25em 0.375em; font-weight: bold;`"

                                >
                                <span

                                    >Objective</span

                                <span
                                    style="display: inline-block; margin-left: 10px; padding: 2px 6px; border-radius: 3px; font-size: 0.85em; font-family: monospace; background: var(--weak-bg-color); color: var(--text-color);"

<section class="histogram-panel" aria-label="Histogram for enabled channels">
 <div class="histogram-heading">Intensity histogram <span>Enabled channels · log count</span></div>

 <template x-for="(channel, index) in microscope_config.channels" :key="channel.handle">

 @dragover="handleChannelDragOver($event)" @drop="handleChannelDrop($event, index)"
 @dragenter="handleChannelDragEnter($event)" @dragleave="handleChannelDragLeave($event)" :class="{ 'channel-inactive': !channel.enabled }">
   <header class="channel-card-header" :id="`channel-display-${channel.handle}`">

                                                    class="drag-handle"
                                                    draggable="true"
                                                    @dragstart="startChannelDrag($event, index)"
                                                    @dragend="endChannelDrag($event)"

                                                    x-bind:tooltip="`Drag to reorder this channel`"
                                                >
                                                    ↕
                                                </div>

     <strong x-text="channel.name"></strong>

    <button @click="Actions.snapChannel({channel})" :disabled="!channel.enabled">Snap</button>

   <div class="channel-card-body">

     <div class="channel-image-caption">Shift + wheel: channels · Alt + wheel: zoom</div>
     <div class="channel-box-fetch-error" x-show="image_fetch_errors[channel.handle]" x-text="image_fetch_errors[channel.handle]?.message ?? ''"></div>
    </div>
    <section class="z-signal-panel" x-data="{ metric: 'p999', fine: 1, coarse: 10, span: 100 }" aria-label="Shared Z movement and channel signal">
     <div class="channel-group-heading">Z & signal <span>Shared stage</span></div>
     <div class="z-position"><strong x-text="signalZUm == null ? 'Z unavailable' : `Z ${signalZUm.toFixed(1)} µm`"></strong><span x-text="focusIsChannelStreaming(channel) ? '● Live' : 'Last frame'"></span></div>
     <div class="z-travel" x-show="signalZRange" :title="signalZRange ? `Motor travel in calibrated coordinates: ${signalZRange.min.toFixed(1)}–${signalZRange.max.toFixed(1)} µm` : ''">
      <div class="z-travel-track">
       <span class="z-reference-mark" x-show="focusReferenceZ != null" :style="`left:${signalRangePercent((focusReferenceZ ?? 0) * 1000)}%`" title="Focus reference">R</span>
       <span class="z-current-mark" x-show="signalZUm != null" :style="`left:${signalRangePercent(signalZUm ?? 0)}%`"></span>
      </div>
      <div class="z-travel-labels"><span x-text="signalZRange?.min.toFixed(0)"></span><span x-text="signalZRange ? `${signalZRange.max.toFixed(0)} µm` : ''"></span></div>
     </div>

                            }

                            .confirm-value {
                                font-weight: bold;
                                color: var(--text-color);
                                text-align: right;
                            }

                            .confirm-comment {
                                overflow: hidden;
                                text-overflow: ellipsis;
                                white-space: nowrap;
                                max-width: 200px;
                            }

                            #confirm-modal-footer,

                            #cancel-modal-footer {
                                padding: 12px 20px;
                                display: flex;
                                justify-content: flex-end;
                                gap: 8px;
                                border-top: 1px solid var(--highlight-color);
                            }

                            #confirm-modal-back,

                            #cancel-modal-back {
                                background: var(--weak-bg-color);
                                color: var(--text-color);
                                border: 1px solid var(--highlight-color);
                                padding: 8px 20px;
                                border-radius: 4px;
                                cursor: pointer;
                            }

                            #confirm-modal-back:hover,

                            #cancel-modal-back:hover {
                                background: var(--highlight-color);
                            }

                            #confirm-modal-start,

                            #cancel-modal-stop,

                            #cancel-modal-takeover {
                                background: #2ecc40;
                                color: white;
                                border: none;
                                padding: 8px 20px;
                                border-radius: 4px;
                                cursor: pointer;
                                font-weight: bold;
                            }

                            #confirm-modal-start:hover,

                            #cancel-modal-stop:hover,

                            #cancel-modal-takeover:hover {
                                opacity: 0.8;
                            }

                            .cached-microscope-delete-button {
                                padding: 0.3em 0.8em;
                                background: #ff4444;
                                color: white;
                                border: none;
                                border-radius: 4px;
                                cursor: pointer;
                            }

                            .cached-microscope-delete-button:hover {
                                opacity: 0.8;
                            }

                            .center-content {
                                display: grid;
                                position: relative;
                            }
                            .center-content * {
                                display: block;
                                height: min-content;
                                position: relative;
                                top: 50%;
                                transform: translateY(-50%);
                            }
                            .popup {
                                position: absolute;
                                top: 0;
                                left: 0;
                                background: var(--strong-bg-color);
                                z-index: 1;
                                transform: translateY(-100%);
                                width: 35em;
                                padding: 0.5em;
                                border: 1px solid var(--text-color);
                                border-radius: 1em;
                            }
                        </style>
                        <script>
                            // Global tracking for currently open popup
                            let currentlyOpenPopup = null;

                            function closeAllPopupsExcept(exceptPopup) {
                                if (currentlyOpenPopup !== null && currentlyOpenPopup !== exceptPopup) {
                                    makeInvisible(currentlyOpenPopup);
                                }
                                currentlyOpenPopup = exceptPopup;
                            }

                            function registerContainedPopup(el) {
                                const target_popups = el.getElementsByClassName("popup");
                                if (target_popups.length != 1) throw new Error(``);
                                const target_popup = target_popups[0];
                                let hideTimeoutId = null;
                                let isOverSpawner = false;
                                let isOverPopup = false;

                                const cancelHideTimeout = () => {
                                    if (hideTimeoutId !== null) {
                                        clearTimeout(hideTimeoutId);
                                        hideTimeoutId = null;
                                    }
                                };

                                const checkAndHide = () => {
                                    cancelHideTimeout();
                                    // Only hide if mouse is over neither element
                                    if (!isOverSpawner && !isOverPopup) {
                                        hideTimeoutId = setTimeout(() => {
                                            makeInvisible(target_popup);
                                            hideTimeoutId = null;
                                        }, interfaceSettings.popupHideDelayMs);
                                    }
                                };

                                makeInvisible(target_popup);
                                el.addEventListener("mouseenter", () => {
                                    isOverSpawner = true;
                                    cancelHideTimeout();
                                    makeVisible(target_popup);
                                    // Close any other open popup
                                    closeAllPopupsExcept(target_popup);
                                });
                                el.addEventListener("mouseleave", () => {
                                    isOverSpawner = false;
                                    checkAndHide();
                                });

                                // Also handle mouse events on the popup itself
                                target_popup.addEventListener("mouseenter", () => {
                                    isOverPopup = true;
                                    cancelHideTimeout();
                                });
                                target_popup.addEventListener("mouseleave", () => {
                                    isOverPopup = false;
                                    checkAndHide();
                                });
                            }
                            function makeVisible(el) {
                                const parentRect = el.parentElement.getBoundingClientRect();

                                // Show popup temporarily to measure it
                                el.style.setProperty("display", "block");
                                el.style.setProperty("left", "0px");
                                const popupWidth = el.offsetWidth;

                                // Calculate centered position on parent
                                let leftPos = parentRect.left + parentRect.width / 2 - popupWidth / 2;

                                // Check right boundary
                                if (leftPos + popupWidth > window.innerWidth - 10) {
                                    leftPos = window.innerWidth - popupWidth - 10;
                                }

                                // Check left boundary
                                if (leftPos < 10) {
                                    leftPos = 10;
                                }

                                // Set final position
                                el.style.setProperty("top", `${parentRect.top}px`);
                                el.style.setProperty("left", `${leftPos}px`);
                            }
                            function makeInvisible(el) {
                                el.style.setProperty("display", "none");
                            }
                        </script>

                        <div style="font-size: 1.6em" class="center-content">
                            <span>Acquisition</span>
                        </div>
                        <div
                            id="acquisition-progress-bar"
                            x-init="registerContainedPopup($el)"
                            x-bind:style="`--progress:${current_acquisition_progress_percent}%;`"
                        >
                            <span>
                                <strong x-text="latest_acquisition_status?.acquisition_status ?? (isAcquisitionRunning ? 'Running' : 'Idle')"></strong>
                                <span x-show="!isAcquisitionRunning" x-text="` · Wells ${microscope_config.plate_wells.filter(w => w.selected && w.row >= 0 && w.col >= 0).length} · Channels ${microscope_config.channels.filter(c => c.enabled).length} · Images ${num_images}`"></span>
                                <span x-show="isAcquisitionRunning">
                                    · <span x-text="`${current_acquisition_progress_percent.toFixed(2)}%`"></span>
                                    · <span x-text="`Remaining ${acquisitionTimeLeftString}`"></span>
                                </span>
                                <template x-if="latest_acquisition_status?.acquisition_progress?.num_autofocus_misses">
                                    <span>
                                        <span>|</span>
                                        <span class="autofocus-misses" x-text="`Autofocus missed ${latest_acquisition_status?.acquisition_progress?.num_autofocus_misses} site(s)`"></span>
                                    </span>
                                </template>
                            </span>

                            <div class="popup">
                                <div style="white-space: normal; font-family: monospace; font-size: 0.9em; line-height: 1.4;">
                                    <div style="font-weight: bold; margin-bottom: 0.5em; font-size: 1.1em;">Acquisition Progress</div>
                                    <div x-text="`Status: ${latest_acquisition_status?.acquisition_status??'not running'} (${current_acquisition_progress_percent.toFixed(2)}%)`"></div>
                                    <div x-text="`Images: ${latest_acquisition_status?.acquisition_progress?.current_num_images??0} / ${latest_acquisition_status?.acquisition_meta_information?.total_num_images??0}`"></div>
                                    <div x-text="`Storage: ${(latest_acquisition_status?.acquisition_progress?.current_storage_usage_GB??0).toFixed(2)} / ${(latest_acquisition_status?.acquisition_meta_information?.max_storage_size_images_GB??0).toFixed(2)} GB`"></div>
                                    <div x-text="`Elapsed: ${acquisitionElapsedTimeString}`"></div>
                                    <div x-text="`Remaining: ${acquisitionTimeLeftString}`"></div>
                                    <div x-show="latest_acquisition_status?.acquisition_progress?.last_image" x-text="`Well: ${latest_acquisition_status?.acquisition_progress?.last_image?.position?.well_name??'--'}`"></div>
                                    <div x-show="latest_acquisition_status?.acquisition_progress?.last_image" x-text="`Site in Well: (${latest_acquisition_status?.acquisition_progress?.last_image?.position?.site_x}, ${latest_acquisition_status?.acquisition_progress?.last_image?.position?.site_y}, ${latest_acquisition_status?.acquisition_progress?.last_image?.position?.site_z})`"></div>
                                    <div x-show="latest_acquisition_status?.acquisition_progress?.last_image" x-text="`Channel: ${latest_acquisition_status?.acquisition_progress?.last_image?.channel?.name??'--'}`"></div>
                                    <div x-show="latest_acquisition_status?.acquisition_progress?.current_timepoint" x-text="`Timepoint: ${latest_acquisition_status?.acquisition_progress?.current_timepoint} / ${latest_acquisition_status?.acquisition_progress?.total_timepoints}`"></div>
                                    <div x-show="latest_acquisition_status?.acquisition_progress?.estimated_timepoint_duration_s" x-text="`Time per Timepoint: ~${latest_acquisition_status?.acquisition_progress?.estimated_timepoint_duration_s?.toFixed(1)}s`"></div>
                                    <div x-text="`${latest_acquisition_status?.message??''}`" x-show="latest_acquisition_status?.message"></div>
                                    <template x-if="latest_acquisition_status?.acquisition_progress?.num_autofocus_misses">
                                        <div class="autofocus-misses" style="margin-top: 0.5em;">
                                            <div x-text="`Autofocus missed ${latest_acquisition_status?.acquisition_progress?.num_autofocus_misses} site(s), imaged without focus; most recent:`"></div>
                                            <template x-for="miss in [...(latest_acquisition_status?.acquisition_progress?.recent_autofocus_misses ?? [])].reverse()">
                                                <div x-text="`${miss.well_name} (${miss.site_x}, ${miss.site_y}) t${miss.timepoint}: ${miss.detail}`"></div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <button @click="await showAcquisitionConfirmation()" :disabled="isAcquisitionRunning"
                            x-init="enabletooltip($el)" tooltip="Show confirmation dialog and start acquisition">Start</button>
                        <button @click="await requestAcquisitionCancel()" :disabled="!isAcquisitionRunning"
                            x-init="enabletooltip($el)" tooltip="Stop the running acquisition (asks for confirmation)">Cancel</button>
                    </div>
                </div>
            </div>
        </template>
    </body>
</html>
